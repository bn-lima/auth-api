services:
  db:
    container_name: auth_api_db
    image: postgres:16
    env_file:
      .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: auth_api
    volumes:
      - .:/app
    restart: always
    depends_on:
      db:
        condition: service_healthy
        
    env_file:
      .env
    build:
      .
    ports:
      - 8000:8000

volumes:
  postgres_data:  