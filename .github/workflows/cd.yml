name: CD

on:
    workflow_run:
        workflows: [CI]
        branches: [main]
        types: [completed]

jobs:
    deploy:
        if: ${{github.event.workflow_run.conclusion == 'success'}}

        runs-on: ubuntu-latest

        steps:
            - name: Deploy on Render
              run: curl --fail --request POST '${{secrets.RENDER_HOOK_URL}}'